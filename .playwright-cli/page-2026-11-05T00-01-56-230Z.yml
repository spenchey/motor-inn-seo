      - heading "Used Trucks for Towing in Iowa" [level=1] [ref=e63]
      - generic [ref=e64]:
        - complementary [ref=e65]:
          - paragraph [ref=e66]: Shopping a used truck to pull a trailer? Start with the trailer weight, not the grille. Then match the tow rating, payload, and hitch setup to that exact truck.
        - paragraph [ref=e67]: A used truck is a good towing pick when the exact truck can handle your load and it shows you that with documentation. Newer Silverado 1500 models can tow from 7,200 to 13,700 pounds. Newer F-150 models can tow from 8,400 to 13,500 pounds. Ram 1500 models can tow up to 11,610 pounds. Used trucks can fall below those benchmark numbers depending on how they were built, so check the VIN before you load.
        - heading "Which used truck should I buy for towing in Iowa?" [level=2] [ref=e68]
        - paragraph [ref=e69]: Buy the truck whose safe tow rating exceeds your loaded trailer, with payload and hitch capacity left over.
        - heading "Can a used truck tow safely through an Iowa winter?" [level=2] [ref=e70]
        - paragraph [ref=e71]: Yes. Iowa can bring ice, snow, and limited visibility. Before a major tow, inspect the trailer, hitch, safety chains, breakaway wiring, trailer brakes, tires, and service history.
        - heading "How do I check a used truck before towing?" [level=2] [ref=e72]
        - paragraph [ref=e73]: Match the VIN's towing package and axle configuration; inspect the hitch frame, wiring, lights, controller, tires, brakes, and service history.
        - heading "Should I buy a half-ton or a three-quarter-ton used truck?" [level=2] [ref=e74]
        - paragraph [ref=e75]: A half-ton is right for a lighter trailer and occasional weekend trip; a three-quarter-ton is easier when you tow regularly or pull heavier loads.
        - heading "Where can I see used trucks for towing near Carroll?" [level=2] [ref=e76]
