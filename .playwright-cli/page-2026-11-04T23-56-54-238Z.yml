                - row [ref=e103]:
                  - cell "Comfort mid" [ref=e104]
                  - cell "XLE, XSE" [ref=e105]
                  - cell "LT, 2LT, 3LT, RS" [ref=e106]
                  - cell "Daily driving with features" [ref=e107]
                - row [ref=e108]:
                  - cell "Off-road" [ref=e109]
                  - cell "TRD Sport, TRD Off-Road" [ref=e110]
                  - cell "Z71, Trail Boss" [ref=e111]
                  - cell "Gravel, trails, towing on rough roads" [ref=e112]
                - row [ref=e113]:
                  - cell "Top" [ref=e114]
                  - cell "Limited, Platinum, Capstone" [ref=e115]
                  - cell "High Country, Premier" [ref=e116]
                  - cell "Most features, luxury feel" [ref=e117]
            - paragraph [ref=e118]: Examples are common equipment ladders, not availability promises — trims on the lot change as inventory turns.
            - heading "Which Trim Is Right for Me?" [level=2] [ref=e119]
            - paragraph [ref=e120]: Match the trim to how you use the vehicle. Towing or rough roads? Look at TRD Off-Road or Z71. Family hauler? XLE, Limited, LT, or High Country add the safety and comfort features that matter most. Watching the budget? SR, SR5, WT, and 1LT trims carry the essentials. City driving? Smaller trims on a RAV4 or Equinox keep it simple.
            - paragraph [ref=e121]: Still unsure? Our team in Carroll will walk you through it. No pressure. Ask us which trim fits your week, not just the sticker.
            - generic [ref=e122]:
              - generic [ref=e125]:
                - heading "Towing or rough roads?" [level=3] [ref=e126]
                - paragraph [ref=e127]: Look at TRD Off-Road or Z71 — and ask us for real tow numbers on the exact unit.
              - generic [ref=e130]:
                - heading "Family hauler?" [level=3] [ref=e131]
                - paragraph [ref=e132]: XLE, Limited, LT, or High Country add the safety and comfort features that matter most.
              - generic [ref=e135]:
                - heading "Watching the budget?" [level=3] [ref=e136]
                - paragraph [ref=e137]: SR, SR5, WT, and 1LT trims carry the essentials — nothing you pay for twice.
            - heading "Compare Trims on Our Lot" [level=2] [ref=e138]
            - paragraph [ref=e139]: See the trims side by side on our live inventory pages. Stock changes daily, so the trims you see today may be gone tomorrow. Filter by model, then compare the trim notes on each listing.
            - paragraph [ref=e140]: Our lot serves Carroll, Lake City, Denison, Audubon, Storm Lake, and Sac City. One visit, both brands, Toyota and Chevrolet under one roof.
