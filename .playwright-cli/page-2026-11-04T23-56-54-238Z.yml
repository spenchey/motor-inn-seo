    - generic [ref=e61]:
      - heading "Vehicle Trim Levels Explained | Carroll, IA" [level=1] [ref=e63]
      - generic [ref=e65]:
        - generic [ref=e68]:
          - generic [ref=e69]:
            - paragraph [ref=e70]: Part of car shopping is finding a vehicle that meets your needs. That’s why car manufacturers offer not only a wide array of models, but also various trim levels for each model. Selecting a trim level allows you to choose specific features and options that you might not necessarily find on the base model, whether you’re looking for more capabilities, sportier styling, or added refinement.
            - img "A blue Ford F-150 pickup truck towing a trailer on a highway" [ref=e72]
            - complementary [ref=e73]:
              - paragraph [ref=e74]: Want to see the trims in person? Browse our live inventory by trim, or call the store and ask our team which one fits. One change per page, no pressure.
            - heading "Car Trim Levels Explained" [level=1] [ref=e75]
            - heading "What Do Car Trim Levels Mean?" [level=2] [ref=e76]
            - paragraph [ref=e77]: A trim level is the equipment package a model comes in. Same truck or SUV, different features. Think engine options, seat fabric, screen size, safety tech. A base trim gets you the essentials. Higher trims add comfort and capability. Prices change with each step up, so we never quote them here. Check the live listing instead.
            - paragraph [ref=e78]: "Example from our lot: a Toyota Tacoma SR5 and a Tacoma TRD Off-Road share the same body. The TRD adds off-road gear. Both are Tacomas. The trim is what separates them."
            - 'heading "Trim Level vs Model: What''s the Difference?" [level=2] [ref=e79]'
            - paragraph [ref=e80]: The model is the vehicle name. The trim is the version of that vehicle. A Silverado is a model. Silverado WT, LT, and High Country are trims. You pick the model first, then the trim that matches your budget and needs.
            - paragraph [ref=e81]: "Why it matters: two shoppers can both say \"I drive a Silverado\" and have very different trucks. One hauls gravel. One commutes. The trim is where those differences live."
            - heading "Toyota Trim Levels Explained (Tacoma, Highlander, Grand Highlander, RAV4)" [level=2] [ref=e82]
            - paragraph [ref=e83]: Toyota trims run from work-ready to loaded. On our Carroll lot you'll see SR and SR5 on trucks, XLE and XSE on crossovers, Limited and Platinum at the top. TRD Sport and TRD Off-Road appear on Tacomas built for rougher ground.
            - paragraph [ref=e84]: "Quick guide: SR/SR5 for work. TRD for trails and towing on rough roads. XLE/XSE for comfort with some style. Limited/Platinum for the most features."
            - heading "Chevrolet Trim Levels Explained (Silverado, Colorado, Equinox, Blazer, Traverse)" [level=2] [ref=e85]
            - paragraph [ref=e86]: Chevy trims follow a similar ladder. WT (Work Truck) is the base. LT adds comfort. Z71 brings off-road suspension. High Country and RS sit near the top. On SUVs you'll see 2LT and 3LT as equipment steps.
            - paragraph [ref=e87]: Need a truck that tows the boat to Storm Lake? A Silverado Z71 or High Country handles it without breathing hard. WT covers the job site.
            - heading "Toyota vs Chevrolet trim ladder — quick reference" [level=3] [ref=e88]
