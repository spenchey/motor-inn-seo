          - heading "Car Trim Levels Explained" [level=1] [ref=e70]
          - paragraph [ref=e71]: "A trim level is the equipment package a model comes in: engine, upholstery, tech, and package differences inside the same vehicle name."
        - heading "What Does Car Trim Level Mean?" [level=2] [ref=e72]
        - paragraph [ref=e73]: A trim level is the version a buyer selects within the model. A base trim gets the essentials; higher trims add comfort, capability, or technology.
        - heading "What's the Difference Between Trim Level and Model?" [level=2] [ref=e74]
        - paragraph [ref=e75]: The model is the vehicle name. The trim is the version of that vehicle, such as SR5, XLE, LT, or High Country.
        - heading "Toyota Trim Levels Explained (Tacoma, Highlander, Grand Highlander, RAV4)" [level=2] [ref=e76]
        - paragraph [ref=e77]: Toyota trims range from SR/SR5 work trucks to XLE/XSE family vehicles and Limited/Platinum loaded models. TRD Sport and TRD Off-Road appear on Tacomas built for rougher ground.
        - heading "Chevrolet Trim Levels Explained (Silverado, Colorado, Equinox, Blazer, Traverse)" [level=2] [ref=e78]
        - paragraph [ref=e79]: Chevrolet trims start at WT and 1LT, then step through LT, Z71, Trail Boss, High Country, and 2LT/3LT SUV versions.
