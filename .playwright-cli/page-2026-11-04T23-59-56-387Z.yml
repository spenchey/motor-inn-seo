      - generic [ref=e58]:
        - complementary [ref=e59]:
          - paragraph [ref=e60]: "A trim level is the equipment package a model comes in: engine, upholstery, tech, and package differences inside the same vehicle name."
        - heading "What Does Car Trim Level Mean?" [level=2] [ref=e61]
        - paragraph [ref=e62]: A trim level is the version a buyer selects within the model. A base trim gets the essentials; higher trims add comfort, capability, or technology.
        - heading "What's the Difference Between Trim Level and Model?" [level=2] [ref=e63]
        - paragraph [ref=e64]: The model is the vehicle name. The trim is the version of that vehicle, such as SR5, XLE, LT, or High Country.
        - heading "Toyota Trim Levels Explained (Tacoma, Highlander, Grand Highlander, RAV4)" [level=2] [ref=e65]
        - paragraph [ref=e66]: Toyota trims range from SR/SR5 work trucks to XLE/XSE family vehicles and Limited/Platinum loaded models. TRD Sport and TRD Off-Road appear on Tacomas built for rougher ground.
